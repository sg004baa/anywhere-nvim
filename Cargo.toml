[workspace]
resolver = "3"
members = ["crates/anvi-core", "crates/anvi"]
# anvi is a Windows-only binary. On the dev machine (Linux) only the
# portable core is built/tested; the binary is built with
#   cargo xwin build -p anvi --target x86_64-pc-windows-msvc
default-members = ["crates/anvi-core"]

[workspace.package]
version = "0.4.4"
license = "MIT OR Apache-2.0"
edition = "2024"
rust-version = "1.97"
publish = false

[workspace.dependencies]
anvi-core = { path = "crates/anvi-core" }
async-trait = "0.1.91"
anyhow = "1.0.104"
nvim-rs = { version = "0.9.2", features = ["use_tokio"] }
rmpv = "1.3.1"
tokio = { version = "1.53", features = [
  "rt-multi-thread",
  "macros",
  "process",
  "net",
  "time",
  "sync",
  "io-util",
] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
global-hotkey = "0.8.0"
tray-icon = "0.24.2"
windows = "0.62.2"
windows-numerics = "0.3.1"
winit = "0.30.13"
raw-window-handle = "0.6.2"
winresource = "0.1.31"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
todo = "deny"
unimplemented = "deny"
